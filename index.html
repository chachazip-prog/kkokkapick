if(sort==='popular')a.sort((x,y)=>compareRecommended(x,y,{stage:view==='search'&&stage!=='전체'?stage:(fitLabel()?stageForMonths(+localStorage.getItem('months')):null)}));document.getElementById('grid').innerHTML=a.length?a.slice(0,100).map(p=>`<article class="card" data-id="${p.id}"><div class="pic"><img src="${esc(p.imageUrl)}" alt="" loading="lazy"></div><button class="heart" data-fav="${p.id}">${favs.has(String(p.id))?'♥':'♡'}</button>${p.brand?`<div class="brandline">${esc(p.brand)}</div>`:'' }<div class="merchant">${esc(p.merchant||'판매처')}${p.offerCount>1?' · '+p.offerCount+'개 판매처':''}</div><div class="name">${esc(p.name)}</div><div class="price">${won(p.price)}${p.offerCount>1?'부터':''}</div>${p.offerCount>1?`<div class="range">${priceRange(p)}</div>`:'' }${p.fitStatus==='verified'?`<span class="fit">꼬까핏 가능</span>`:''}</article>`).join(''):'<div class="empty">검색 결과가 없어요.</div>';document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openDetail(x.dataset.id));document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();fav(x.dataset.fav)});document.getElementById('favCount').textContent=`찜 ${favs.size}`}
function fav(id){id=String(id);favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('favs',JSON.stringify([...favs]));render()}
function setView(next){view=next;favOnly=next==='favorites';document.getElementById('searchTools').hidden=next!=='search';document.getElementById('homeHero').hidden=next!=='home';document.getElementById('sectionTitle').textContent=next==='search'?'검색 결과':next==='favorites'?'찜한 상품':'계속 둘러보세요';for(const id of ['homeNav','searchNav','favNav'])document.getElementById(id)?.classList.remove('on');document.getElementById(next==='search'?'searchNav':next==='favorites'?'favNav':'homeNav')?.classList.add('on');render();if(next==='search')document.getElementById('q')?.focus()}function toggleFavOnly(){setView(favOnly?'home':'favorites')}function clearFilters(){cat='전체';stage='전체';brand='전체';document.getElementById('q').value='';document.getElementById('fitOnly').checked=false;document.getElementById('sort').value='popular';render()}
function fitForProduct(p){
 const profile={
   months:localStorage.getItem('months'),
   height:localStorage.getItem('height'),
   weight:localStorage.getItem('weight')
 };
 const result=evaluateFit(profile,p);
 if(result.status==='profile_required')
   return{kind:'profile',html:'<div class="offer"><div><b>꼬까핏</b><br><span>월령·키·몸무게를 등록하면 확인할 수 있어요.</span></div><button class="buy" onclick="closeDetail();openFit()">아이 정보 입력</button></div>'};
 if(result.status==='recommended')
   return{kind:'verified',html:'<div class="offer"><div><b>꼬까핏 · '+esc(result.label)+'</b><br><span>'+esc(result.brand)+' 공식 권장 사이즈표 기준</span></div><span class="fit">공식 기준</span></div><p class="note">아이 체형과 상품별 핏에 따라 달라질 수 있으므로 판매처의 실제 옵션과 상세 사이즈를 최종 확인하세요.</p>'};
 if(p.fitStatus==='candidate')
   return{kind:'candidate',html:'<div class="offer"><div><b>꼬까핏 · 공식 사이즈표 확인 중</b><br><span>판매처 자료는 확인했지만 브랜드 공식 원문 검증 전이라 사이즈를 추천하지 않아요.</span></div></div>'};
 return{kind:'unknown',html:'<div class="offer"><div><b>꼬까핏 · 사이즈 정보 확인 필요</b><br><span>검증된 브랜드 사이즈표가 없어 임의로 추천하지 않아요.</span></div></div>'};
}
function openDetail(id){let p=products.find(x=>String(x.id)===String(id));let offers=(p.offers||[]).slice().sort((a,b)=>(a.price||Infinity)-(b.price||Infinity));let rows=offers.map((o,i)=>{const dc=discountOf(o);return '<div class="offer"><div><b>'+esc(o.merchant||'판매처')+'</b><br><strong>'+won(o.price)+'</strong>'+(o.originalPrice&&Number(o.originalPrice)>Number(o.price)?'<span class="oldprice">'+won(o.originalPrice)+'</span>':'')+(dc?'<br><span class="meta">'+dc+'% 할인</span>':'')+(i===0&&offers.length>1?' <span class="fit">최저가</span>':'')+'</div><button class="buy" data-buy="'+encodeURIComponent(o.affiliateUrl||'')+'">구매</button></div>'}).join('');let fit=fitForProduct(p);document.getElementById('detailPanel').innerHTML='<button class="close" onclick="closeDetail()">×</button><div class="detailpic"><img src="'+esc(p.imageUrl)+'" alt=""></div><div class="merchant">'+esc(p.cat)+(offers.length>1?' · '+offers.length+'개 판매처':'')+'</div><h2>'+esc(p.name)+'</h2><h3>꼬까핏</h3>'+fit.html+'<h3>가격 알림</h3>'+priceAlertHtml(p)+'<h3>판매처 가격 비교</h3>'+rows+'<p class="note">판매처에서 가격·옵션·배송정보를 최종 확인하세요. 구매 버튼은 제휴 추적 링크로 이동합니다.</p>';document.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>window.open(decodeURIComponent(x.dataset.buy),'_blank','noopener'));document.getElementById('detail').classList.add('on')}
function priceChangeHtml(p){
 const e=getLatestPriceChange(priceHistory,p.id);
 if(!e)return '';
 const amount=Math.abs(Number(e.changeAmount)||0);
 const label=e.direction==='down'?'지난 확인보다 '+won(amount)+' 내려갔어요':'지난 확인보다 '+won(amount)+' 올랐어요';
 return '<div class="offer"><div><b>가격 변동</b><br><span>'+esc(label)+'</span></div><span class="fit">'+(e.direction==='down'?'가격 하락':'가격 변동')+'</span></div>';
}
function priceAlertHtml(p){
 const alerts=JSON.parse(localStorage.getItem('priceAlerts')||'{}');
 const v=alerts[p.id]||'';
 const reached=isTargetPriceReached(p.price,v);
 return priceChangeHtml(p)+'<div class="offer"><div><b>희망 가격</b><br><span>현재 '+won(p.price)+(reached?' · 희망가 도달':'')+'</span></div><div><input id="alertPrice" type="number" value="'+esc(v)+'" placeholder="예: 30000" style="width:105px;padding:9px;border:1px solid #ddd;border-radius:8px"><button class="buy" onclick="savePriceAlert(\\''+String(p.id).replace(/'/g,"\\\\'")+'\\')">저장</button></div></div><p class="note">현재 데모에서는 희망 가격만 이 기기에 저장합니다. 실제 알림 발송은 로그인·백엔드 연동 후 제공됩니다.</p>';
}
function savePriceAlert(id){
 const input=document.getElementById('alertPrice'); const value=Number(input?.value);
 const alerts=JSON.parse(localStorage.getItem('priceAlerts')||'{}');
 if(Number.isFinite(value)&&value>0) alerts[id]=Math.round(value); else delete alerts[id];
 localStorage.setItem('priceAlerts',JSON.stringify(alerts));
 if(input) input.value=alerts[id]||'';const p=products.find(x=>String(x.id)===String(id));if(p)openDetail(id);render();
}
function closeDetail(){document.getElementById('detail').classList.remove('on')}function openFit(){document.getElementById('fit').classList.add('on');['months','height','weight'].forEach(x=>document.getElementById(x).value=localStorage.getItem(x)||'')}function closeFit(){document.getElementById('fit').classList.remove('on')}function saveFit(){['months','height','weight'].forEach(x=>localStorage.setItem(x,document.getElementById(x).value));let m=localStorage.getItem('months');document.getElementById('fitHero').textContent=m?`${m}개월 우리 아이 맞춤 추천 👶`:'우리 아이에게 맞는 옷만 👶';if(m!=='')stage=stageForMonths(+m);closeFit();render()}
async function loadProducts(){try{let [r,hr]=await Promise.all([fetch('./data/catalog.json?ts='+Date.now()),fetch('./data/price-history.json?ts='+Date.now()).catch(()=>null)]);if(!r.ok)throw new Error('catalog fetch failed');let d=await r.json();if(hr?.ok){let hd=await hr.json();priceHistory=hd.events||[];}if(d.expiresAt&&Date.now()>=Date.parse(d.expiresAt)){products=[];document.getElementById('grid').innerHTML='<div class="empty">상품 정보를 갱신하고 있어요.<br><small>최신 가격 확인 후 다시 보여드릴게요.</small></div>';return}products=(d.products||[]).map((p,i)=>({...p,id:p.id||String(i),price:p.minPrice,merchant:p.offers?.[0]?.merchant||'',affiliateUrl:p.offers?.[0]?.affiliateUrl||'',cat:p.category||categoryOf(p),stage:p.stage||'전체'}));cats=['전체',...new Set(products.map(p=>p.cat).filter(x=>x!=='기타'))];render()}catch(e){products=[];document.getElementById('grid').innerHTML='<div class="empty">상품 정보를 불러오지 못했어요.<br><small>잠시 후 다시 시도해주세요.</small></div>'}}
Object.assign(window,{openDetail,closeDetail,openFit,closeFit,saveFit,savePriceAlert,setView,toggleFavOnly,clearFilters});window.__kkokkapickBooted=true;
document.getElementById('q').addEventListener('input',render);if(localStorage.getItem('months')){document.getElementById('fitHero').textContent=`${localStorage.getItem('months')}개월 우리 아이 맞춤 추천 👶`;stage=stageForMonths(+localStorage.getItem('months'))}loadProducts();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');

renderCommercialHome();
