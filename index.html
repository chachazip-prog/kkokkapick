<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f2"><title>꼬까픽 Demo</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:#f5f5f5;color:#202020}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding-bottom:84px}.top{position:sticky;top:0;z-index:4;background:#fff;padding:18px 18px 10px;border-bottom:1px solid #eee}.brand{font-size:25px;font-weight:900;letter-spacing:-1.2px}.brand b{color:#ff7043}.sub{font-size:12px;color:#777;margin-top:2px}.search{margin-top:14px;background:#f6f6f6;border-radius:14px;padding:12px 14px;display:flex;gap:8px}.search input{border:0;background:transparent;outline:0;width:100%;font-size:15px}.hero{margin:16px 18px;background:#fff1e9;border-radius:22px;padding:20px}.hero small{color:#d85b35;font-weight:700}.hero h2{margin:7px 0;font-size:22px;letter-spacing:-.8px}.hero p{margin:0;color:#6d625e;font-size:13px;line-height:1.5}.chips{display:flex;overflow:auto;gap:8px;padding:0 18px 12px}.chip{white-space:nowrap;border:1px solid #e8e8e8;border-radius:18px;padding:8px 13px;font-size:13px;background:white}.chip.active{background:#222;color:#fff;border-color:#222}.section{padding:4px 18px}.section h3{font-size:19px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px}.card{position:relative}.pic{aspect-ratio:1/1;border-radius:16px;background:linear-gradient(145deg,#f8e9dd,#eee);display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}.pic img,.detailpic img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:9px;top:9px;background:#ffffffdd;border:0;border-radius:50%;width:34px;height:34px;font-size:18px}.merchant{font-size:11px;color:#888;margin-top:8px}.name{font-size:14px;margin-top:3px;line-height:1.35}.price{font-weight:800;margin-top:5px}.fit{font-size:11px;color:#e45f38;background:#fff1eb;padding:4px 7px;border-radius:6px;display:inline-block;margin-top:6px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;height:70px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding-top:10px;z-index:5}.nav{text-align:center;font-size:11px;color:#777}.nav span{display:block;font-size:21px;margin-bottom:3px}.nav.on{color:#e85d32;font-weight:700}.sheet{display:none;position:fixed;inset:0;background:#0005;z-index:10;align-items:flex-end;justify-content:center}.sheet.on{display:flex}.panel{width:min(480px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}.detailpic{height:220px;border-radius:18px;background:#f6e8dd;display:flex;align-items:center;justify-content:center;font-size:90px;margin-top:38px}.offer{border:1px solid #eee;border-radius:14px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;align-items:center}.buy{border:0;background:#ff7043;color:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.profile{background:#fff7f3;border-radius:16px;padding:15px;margin:12px 0}.profile input{width:30%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-right:4px}.cta{width:100%;border:0;background:#222;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:8px}.empty{padding:40px;text-align:center;color:#888}.note{font-size:11px;color:#999;margin:18px 0 4px;line-height:1.5}
</style></head><body><div class="app"><header class="top"><div class="brand">꼬까<b>픽</b></div><div class="sub">우리 아이 옷, 한곳에서.</div><div class="search">⌕ <input id="q" placeholder="브랜드, 상품을 검색해보세요"></div><div style="display:flex;justify-content:flex-end;margin-top:8px"><select id="sort" onchange="render()" style="border:0;background:#fff;font-size:12px;color:#666"><option value="popular">추천순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option></select></div></header><div class="hero" onclick="openFit()"><small>KKOKKAFIT</small><h2 id="fitHero">우리 아이에게 맞는 옷만 👶</h2><p>월령 · 키 · 몸무게를 등록하면 사이즈에 맞는 상품을 먼저 보여드려요. ›</p></div><div class="chips" id="stages"></div><div class="chips" id="chips"></div><section class="section"><h3>지금 많이 보는 아기옷</h3><div class="grid" id="grid"></div></section></div><nav class="bottom"><div class="nav on"><span>⌂</span>홈</div><div class="nav"><span>⌕</span>검색</div><div class="nav"><span>♡</span><i id="favCount">찜</i></div><div class="nav" onclick="openFit()"><span>☺</span>마이</div></nav><div class="sheet" id="detail"><div class="panel" id="detailPanel"></div></div><div class="sheet" id="fit"><div class="panel"><button class="close" onclick="closeFit()">×</button><h2>꼬까핏</h2><p>아이 정보를 입력하면 데모 추천 사이즈를 계산합니다.</p><div class="profile"><input id="months" type="number" placeholder="개월"><input id="height" type="number" placeholder="키 cm"><input id="weight" type="number" placeholder="kg"></div><button class="cta" onclick="saveFit()">아이 정보 저장</button><p class="note">데모 추천은 단순 규칙 기반입니다. 실제 서비스에서는 브랜드별 사이즈표와 상품 데이터를 반영합니다.</p></div></div><script>
let products=[],cat='전체',stage='전체',favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]')),cats=['전체'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function won(n){return n?Number(n).toLocaleString('ko-KR')+'원':'가격 확인'}
function categoryOf(p){let q=p.query||'',n=p.name||'';if(/바디수트|바디슈트|우주복/.test(q+n))return'바디수트';if(/원피스/.test(q+n))return'원피스';if(/가디건|아우터|점퍼|자켓|코트/.test(q+n))return'아우터';if(/상하복|내복|내의|실내복/.test(q+n))return'상하복';if(/티셔츠|맨투맨|셔츠/.test(q+n))return'상의';if(/바지|레깅스/.test(q+n))return'하의';return'기타'}
function stageForMonths(m){if(m<4)return'신생아';if(m<24)return'베이비';if(m<48)return'유아';if(m<72)return'토들러';return'키즈'} function fitLabel(){let raw=localStorage.getItem('months');if(raw===null||raw==='')return null;return stageForMonths(+raw)+' 상품'}
function render(){const stages=['전체','신생아','베이비','유아','토들러','키즈'];document.getElementById('stages').innerHTML=stages.map(x=>`<button class="chip ${x===stage?'active':''}" data-stage="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;render()});document.getElementById('chips').innerHTML=cats.map(x=>`<button class="chip ${x===cat?'active':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});let q=document.getElementById('q').value.toLowerCase();let a=products.filter(p=>(stage==='전체'||p.stage===stage||(stage==='토들러'&&(p.stage==='유아'||p.stage==='키즈')))&&(cat==='전체'||p.cat===cat)&&(`${p.name} ${p.merchant}`.toLowerCase().includes(q)));let sort=document.getElementById('sort')?.value;if(sort==='low')a.sort((x,y)=>(x.price||Infinity)-(y.price||Infinity));if(sort==='high')a.sort((x,y)=>(y.price||0)-(x.price||0));document.getElementById('grid').innerHTML=a.length?a.slice(0,100).map(p=>`<article class="card" data-id="${p.id}"><div class="pic"><img src="${esc(p.imageUrl)}" alt="" loading="lazy"></div><button class="heart" data-fav="${p.id}">${favs.has(p.id)?'♥':'♡'}</button><div class="merchant">${esc(p.merchant||'판매처')}${p.offerCount>1?' · '+p.offerCount+'개 판매처':''}</div><div class="name">${esc(p.name)}</div><div class="price">${won(p.price)}${p.offerCount>1?'부터':''}</div>${fitLabel()?`<span class="fit">${fitLabel()}</span>`:''}</article>`).join(''):'<div class="empty">검색 결과가 없어요.</div>';document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openDetail(x.dataset.id));document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();fav(x.dataset.fav)});document.getElementById('favCount').textContent=`찜 ${favs.size}`}
function fav(id){favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('favs',JSON.stringify([...favs]));render()}
function openDetail(id){let p=products.find(x=>String(x.id)===String(id));let offers=(p.offers||[]).slice().sort((a,b)=>(a.price||Infinity)-(b.price||Infinity));let rows=offers.map((o,i)=>'<div class="offer"><div><b>'+esc(o.merchant||'판매처')+'</b><br><strong>'+won(o.price)+'</strong>'+(i===0&&offers.length>1?' <span class="fit">최저가</span>':'')+'</div><button class="buy" data-buy="'+encodeURIComponent(o.affiliateUrl||'')+'">구매</button></div>').join('');document.getElementById('detailPanel').innerHTML='<button class="close" onclick="closeDetail()">×</button><div class="detailpic"><img src="'+esc(p.imageUrl)+'" alt=""></div><div class="merchant">'+esc(p.cat)+(offers.length>1?' · '+offers.length+'개 판매처':'')+'</div><h2>'+esc(p.name)+'</h2><h3>판매처 가격 비교</h3>'+rows+'<p class="note">판매처에서 가격·옵션·배송정보를 최종 확인하세요. 구매 버튼은 제휴 추적 링크로 이동합니다.</p>';document.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>window.open(decodeURIComponent(x.dataset.buy),'_blank','noopener'));document.getElementById('detail').classList.add('on')}
function closeDetail(){document.getElementById('detail').classList.remove('on')}function openFit(){document.getElementById('fit').classList.add('on');['months','height','weight'].forEach(x=>document.getElementById(x).value=localStorage.getItem(x)||'')}function closeFit(){document.getElementById('fit').classList.remove('on')}function saveFit(){['months','height','weight'].forEach(x=>localStorage.setItem(x,document.getElementById(x).value));let m=localStorage.getItem('months');document.getElementById('fitHero').textContent=m?`${m}개월 우리 아이 맞춤 추천 👶`:'우리 아이에게 맞는 옷만 👶';if(m!=='')stage=stageForMonths(+m);closeFit();render()}
async function loadProducts(){try{let r=await fetch('./data/catalog.json?ts='+Date.now());if(!r.ok)throw new Error('catalog fetch failed');let d=await r.json();if(d.expiresAt&&Date.now()>=Date.parse(d.expiresAt)){products=[];document.getElementById('grid').innerHTML='<div class="empty">상품 정보를 갱신하고 있어요.<br><small>최신 가격 확인 후 다시 보여드릴게요.</small></div>';return}products=(d.products||[]).map((p,i)=>({...p,id:p.id||String(i),price:p.minPrice,merchant:p.offers?.[0]?.merchant||'',affiliateUrl:p.offers?.[0]?.affiliateUrl||'',cat:p.category||categoryOf(p),stage:p.stage||'전체'}));cats=['전체',...new Set(products.map(p=>p.cat).filter(x=>x!=='기타'))];render()}catch(e){products=[];document.getElementById('grid').innerHTML='<div class="empty">상품 정보를 불러오지 못했어요.<br><small>잠시 후 다시 시도해주세요.</small></div>'}}
document.getElementById('q').addEventListener('input',render);if(localStorage.getItem('months')){document.getElementById('fitHero').textContent=`${localStorage.getItem('months')}개월 우리 아이 맞춤 추천 👶`;stage=stageForMonths(+localStorage.getItem('months'))}loadProducts();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
