<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f2"><title>꼬까픽 Demo</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;background:#f5f5f5;color:#202020}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;padding-bottom:84px}.top{position:sticky;top:0;z-index:4;background:#fff;padding:18px 18px 10px;border-bottom:1px solid #eee}.brand{font-size:25px;font-weight:900;letter-spacing:-1.2px}.brand b{color:#ff7043}.sub{font-size:12px;color:#777;margin-top:2px}.search{margin-top:14px;background:#f6f6f6;border-radius:14px;padding:12px 14px;display:flex;gap:8px}.search input{border:0;background:transparent;outline:0;width:100%;font-size:15px}.hero{margin:16px 18px;background:#fff1e9;border-radius:22px;padding:20px}.hero small{color:#d85b35;font-weight:700}.hero h2{margin:7px 0;font-size:22px;letter-spacing:-.8px}.hero p{margin:0;color:#6d625e;font-size:13px;line-height:1.5}.chips{display:flex;overflow:auto;gap:8px;padding:0 18px 12px}.chip{white-space:nowrap;border:1px solid #e8e8e8;border-radius:18px;padding:8px 13px;font-size:13px;background:white}.chip.active{background:#222;color:#fff;border-color:#222}.section{padding:4px 18px}.section h3{font-size:19px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px}.card{position:relative}.pic{aspect-ratio:1/1;border-radius:16px;background:linear-gradient(145deg,#f8e9dd,#eee);display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}.heart{position:absolute;right:9px;top:9px;background:#ffffffdd;border:0;border-radius:50%;width:34px;height:34px;font-size:18px}.merchant{font-size:11px;color:#888;margin-top:8px}.name{font-size:14px;margin-top:3px;line-height:1.35}.price{font-weight:800;margin-top:5px}.fit{font-size:11px;color:#e45f38;background:#fff1eb;padding:4px 7px;border-radius:6px;display:inline-block;margin-top:6px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;height:70px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding-top:10px;z-index:5}.nav{text-align:center;font-size:11px;color:#777}.nav span{display:block;font-size:21px;margin-bottom:3px}.nav.on{color:#e85d32;font-weight:700}.sheet{display:none;position:fixed;inset:0;background:#0005;z-index:10;align-items:flex-end;justify-content:center}.sheet.on{display:flex}.panel{width:min(480px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}.detailpic{height:220px;border-radius:18px;background:#f6e8dd;display:flex;align-items:center;justify-content:center;font-size:90px;margin-top:38px}.offer{border:1px solid #eee;border-radius:14px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;align-items:center}.buy{border:0;background:#ff7043;color:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.profile{background:#fff7f3;border-radius:16px;padding:15px;margin:12px 0}.profile input{width:30%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-right:4px}.cta{width:100%;border:0;background:#222;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:8px}.empty{padding:40px;text-align:center;color:#888}.note{font-size:11px;color:#999;margin:18px 0 4px;line-height:1.5}
</style></head><body><div class="app"><header class="top"><div class="brand">꼬까<b>픽</b></div><div class="sub">우리 아이 옷, 한곳에서.</div><div class="search">⌕ <input id="q" placeholder="브랜드, 상품을 검색해보세요"></div></header><div class="hero" onclick="openFit()"><small>KKOKKAFIT</small><h2 id="fitHero">우리 아이에게 맞는 옷만 👶</h2><p>월령 · 키 · 몸무게를 등록하면 사이즈에 맞는 상품을 먼저 보여드려요. ›</p></div><div class="chips" id="chips"></div><section class="section"><h3>지금 많이 보는 아기옷</h3><div class="grid" id="grid"></div></section></div><nav class="bottom"><div class="nav on"><span>⌂</span>홈</div><div class="nav"><span>⌕</span>검색</div><div class="nav"><span>♡</span><i id="favCount">찜</i></div><div class="nav" onclick="openFit()"><span>☺</span>마이</div></nav><div class="sheet" id="detail"><div class="panel" id="detailPanel"></div></div><div class="sheet" id="fit"><div class="panel"><button class="close" onclick="closeFit()">×</button><h2>꼬까핏</h2><p>아이 정보를 입력하면 데모 추천 사이즈를 계산합니다.</p><div class="profile"><input id="months" type="number" placeholder="개월"><input id="height" type="number" placeholder="키 cm"><input id="weight" type="number" placeholder="kg"></div><button class="cta" onclick="saveFit()">아이 정보 저장</button><p class="note">데모 추천은 단순 규칙 기반입니다. 실제 서비스에서는 브랜드별 사이즈표와 상품 데이터를 반영합니다.</p></div></div><script>
const products=[
{id:1,e:'🧸',brand:'Little Cotton',name:'베이비 코튼 바디수트',cat:'바디수트',sizes:['70','80','90'],offers:[['제휴몰 A',27900,0],['제휴몰 B',25900,3000]]},
{id:2,e:'👕',brand:'Mellow Kids',name:'키즈 데일리 상하복',cat:'상하복',sizes:['80','90','100','110'],offers:[['제휴몰 C',32900,0],['제휴몰 D',31500,3000]]},
{id:3,e:'🧥',brand:'Petit Day',name:'소프트 니트 가디건',cat:'아우터',sizes:['80','90','100'],offers:[['제휴몰 A',39900,0]]},
{id:4,e:'👗',brand:'Bebe Garden',name:'플라워 코튼 원피스',cat:'원피스',sizes:['80','90','100','110'],offers:[['제휴몰 E',34900,0],['제휴몰 B',32900,3000]]},
{id:5,e:'🌙',brand:'Tiny Night',name:'오가닉 코튼 실내복',cat:'실내복',sizes:['70','80','90','100'],offers:[['제휴몰 C',21900,0]]},
{id:6,e:'🧢',brand:'Mini Sunday',name:'데일리 베이비 맨투맨',cat:'상의',sizes:['80','90','100'],offers:[['제휴몰 D',24900,0]]}
];let cat='전체',favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]'));const cats=['전체',...new Set(products.map(p=>p.cat))];
function won(n){return n.toLocaleString('ko-KR')+'원'}function cheapest(p){return Math.min(...p.offers.map(o=>o[1]+o[2]))}function fitSize(p){let h=+localStorage.getItem('height');if(!h)return null;let s=Math.ceil(h/10)*10;return p.sizes.includes(String(s))?String(s):p.sizes.find(x=>+x>=s)||p.sizes.at(-1)}
function render(){document.getElementById('chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('');let q=document.getElementById('q').value.toLowerCase();let a=products.filter(p=>(cat==='전체'||p.cat===cat)&&(`${p.name} ${p.brand}`.toLowerCase().includes(q)));document.getElementById('grid').innerHTML=a.length?a.map(p=>`<article class="card" onclick="openDetail(${p.id})"><div class="pic">${p.e}</div><button class="heart" onclick="event.stopPropagation();fav(${p.id})">${favs.has(p.id)?'♥':'♡'}</button><div class="merchant">${p.brand} · ${p.offers.length}개 판매처</div><div class="name">${p.name}</div><div class="price">${won(cheapest(p))}부터</div>${fitSize(p)?`<span class="fit">꼬까핏 ${fitSize(p)} 추천</span>`:''}</article>`).join(''):'<div class="empty">검색 결과가 없어요.</div>';document.getElementById('favCount').textContent=`찜 ${favs.size}`}
function fav(id){favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('favs',JSON.stringify([...favs]));render()}
function openDetail(id){let p=products.find(x=>x.id===id);document.getElementById('detailPanel').innerHTML=`<button class="close" onclick="closeDetail()">×</button><div class="detailpic">${p.e}</div><div class="merchant">${p.brand} · ${p.cat}</div><h2>${p.name}</h2>${fitSize(p)?`<div class="profile"><b>꼬까핏 추천: ${fitSize(p)} 사이즈</b><br><small>등록한 아이 키를 기준으로 한 데모 추천입니다.</small></div>`:''}<h3>판매처 가격 비교</h3>${p.offers.sort((a,b)=>(a[1]+a[2])-(b[1]+b[2])).map((o,i)=>`<div class="offer"><div><b>${o[0]}</b><br><small>상품 ${won(o[1])} · 배송 ${o[2]?won(o[2]):'무료'}</small><br><strong>${won(o[1]+o[2])}</strong>${i===0?' <span class="fit">최저 실구매가</span>':''}</div><button class="buy" onclick="alert('실서비스에서는 제휴 구매 링크로 이동합니다.')">구매</button></div>`).join('')}<p class="note">현재는 UX 확인용 샘플 상품입니다. 실제 제휴 상품/API는 다음 연동 단계에서 적용됩니다.</p>`;document.getElementById('detail').classList.add('on')}
function closeDetail(){document.getElementById('detail').classList.remove('on')}function openFit(){document.getElementById('fit').classList.add('on');['months','height','weight'].forEach(x=>document.getElementById(x).value=localStorage.getItem(x)||'')}function closeFit(){document.getElementById('fit').classList.remove('on')}function saveFit(){['months','height','weight'].forEach(x=>localStorage.setItem(x,document.getElementById(x).value));let m=localStorage.getItem('months');document.getElementById('fitHero').textContent=m?`${m}개월 우리 아이 맞춤 추천 👶`:'우리 아이에게 맞는 옷만 👶';closeFit();render()}
document.getElementById('q').addEventListener('input',render);if(localStorage.getItem('months'))document.getElementById('fitHero').textContent=`${localStorage.getItem('months')}개월 우리 아이 맞춤 추천 👶`;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
