name: Deploy Flutter UI preview

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: flutter analyze
      - working-directory: flutter
        run: flutter test
      - name: Generate disposable Web platform
        working-directory: flutter
        run: flutter create --platforms=web --project-name=kkokkapick .
      - name: Build Flutter preview
        working-directory: flutter
        run: flutter build web --release --base-href /kkokkapick/flutter-preview/
      - name: Verify preview bundle
        run: |
          test -f flutter/build/web/index.html
          test -f flutter/build/web/flutter_bootstrap.js
          echo "Preview bundle is valid. Pages currently publishes from main/root, so the reviewed bundle must be committed under /flutter-preview/ on main."
