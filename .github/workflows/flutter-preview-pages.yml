name: Deploy Flutter UI preview

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: flutter analyze
      - working-directory: flutter
        run: flutter test
      - name: Generate disposable Web platform
        working-directory: flutter
        run: flutter create --platforms=web --project-name=kkokkapick .
      - name: Build Flutter preview
        working-directory: flutter
        run: flutter build web --release --base-href /kkokkapick/flutter-preview/
      - name: Publish preview into gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages || true
          rm -rf /tmp/kkokkapick-pages
          mkdir -p /tmp/kkokkapick-pages
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/kkokkapick-pages origin/gh-pages
          else
            git worktree add --detach /tmp/kkokkapick-pages
            cd /tmp/kkokkapick-pages
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
          cd /tmp/kkokkapick-pages
          rm -rf flutter-preview
          mkdir -p flutter-preview
          cp -R "$GITHUB_WORKSPACE/flutter/build/web/." flutter-preview/
          touch .nojekyll
          git add flutter-preview .nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy Flutter UI preview"
          git push origin HEAD:gh-pages
