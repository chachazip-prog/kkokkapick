name: Deploy Flutter UI preview

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: flutter analyze
      - working-directory: flutter
        run: flutter test
      - name: Generate disposable Web platform
        working-directory: flutter
        run: flutter create --platforms=web --project-name=kkokkapick .
      - name: Build Flutter preview
        working-directory: flutter
        run: flutter build web --release --base-href /kkokkapick/flutter-preview/
      - name: Publish preview into active Pages source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -f flutter/build/web/index.html
          test -f flutter/build/web/flutter_bootstrap.js
          rm -rf flutter-preview
          mkdir -p flutter-preview
          cp -R flutter/build/web/. flutter-preview/
          git add -f flutter-preview
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy Flutter UI preview [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
