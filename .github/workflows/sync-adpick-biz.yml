name: Sync ADPICK BIZ baby clothes
# Recovery trigger: wave-3 proven recall queries are now part of publication discovery.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-adpick-biz.yml"
  schedule:
    - cron: "43 * * * *"

permissions:
  contents: write

concurrency:
  group: adpick-biz-sync
  # Prefer the newest main revision; an older long-running provider probe must not block fresh diagnostics/publication.
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'chachazip-prog/kkokkapick'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preserve previous catalog coverage baseline
        run: |
          cp data/adpick-biz-products.json /tmp/adpick-baseline-source.json
          cp data/catalog.json /tmp/adpick-baseline-catalog.json
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          const syncedAt = catalog.syncedAt || catalog.generatedAt || catalog.updatedAt;
          if (!syncedAt) throw new Error('Catalog freshness timestamp missing');
          const ageHours = (Date.now() - Date.parse(syncedAt)) / 3600000;
          const evidence = { checkedAt: new Date().toISOString(), syncedAt, ageHours: Math.round(ageHours * 100) / 100, staleAfterHours: 24, stale: ageHours > 24 };
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/catalog-freshness.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          if (evidence.stale) console.warn('Catalog is stale because provider recovery has not produced a safe refresh.');
          NODE

      - name: Probe broad ADPICK search canaries
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_BIZ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { AdpickBizProvider } from "./src/adpick-biz-provider.js";
          import { ADPICK_BROAD_QUERY_CANARIES, ADPICK_SEARCH_LIMIT, ADPICK_DISCOVERY_PACING_MS } from "./src/adpick-discovery-plan.js";
          const provider = new AdpickBizProvider({ apiKey: process.env.ADPICK_BIZ_API_KEY });
          const rows = [];
          for (const query of ADPICK_BROAD_QUERY_CANARIES) {
            const products = await provider.search(query, { limit: ADPICK_SEARCH_LIMIT });
            rows.push({ query, returned: products.length });
            console.log("[adpick-broad-canary]", JSON.stringify(rows.at(-1)));
            await new Promise(resolve => setTimeout(resolve, ADPICK_DISCOVERY_PACING_MS));
          }
          console.log("[adpick-broad-canary-summary]", JSON.stringify({ returnedTotal: rows.reduce((n, x) => n + x.returned, 0), queries: rows }));
          NODE

      - name: Search baby and kids apparel
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_BIZ_API_KEY }}
          ADPICK_MIN_IMAGE_HEALTH_RATE: "0.8"
          ADPICK_IMAGE_CONCURRENCY: "12"
        run: |
          node -e "import('./src/adpick-discovery-plan.js').then(m=>{if(m.ADPICK_DISCOVERY_QUERIES.length<45)throw new Error('Refusing legacy discovery plan');console.log('Discovery queries:',m.ADPICK_DISCOVERY_QUERIES.length)})"
          node scripts/discover-adpick.js
          node scripts/build-catalog.js
          node scripts/catalog-quality-report.js | tee catalog-quality-report.json

      - name: Guard catalog coverage before publication
        env:
          CATALOG_BASELINE_SOURCE: /tmp/adpick-baseline-source.json
          CATALOG_BASELINE_CANONICAL: /tmp/adpick-baseline-catalog.json
          ADPICK_MIN_SOURCE_PRODUCTS: "300"
          ADPICK_MIN_CANONICAL_PRODUCTS: "250"
          ADPICK_MIN_PREVIOUS_RATIO: "0.65"
        run: node scripts/catalog-coverage-guard.js

      - name: Commit catalog
        run: |
          if git diff --quiet -- data/adpick-biz-products.json data/catalog.json data/price-history.json catalog-quality-report.json; then exit 0; fi
          git config user.name "kkokkapick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adpick-biz-products.json data/catalog.json data/price-history.json catalog-quality-report.json
          git commit -m "chore: refresh ADPICK BIZ baby catalog"
          # main may move while the long provider sync is running (for example,
          # when product code is updated). Rebase the generated data commit
          # instead of failing with a non-fast-forward push.
          git fetch origin main
          # Never let data generated by an older code revision overwrite a newer main.
          # If main moved, rerun on the next workflow invocation against that revision.
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "main moved during provider sync; refusing stale catalog publication"
            exit 1
          fi
          git push origin HEAD:main

      - name: Verify catalog image health after publish
        env:
          IMAGE_HEALTH_SAMPLE_SIZE: "40"
          IMAGE_HEALTH_TIMEOUT_MS: "5000"
          IMAGE_HEALTH_CONCURRENCY: "5"
          IMAGE_HEALTH_MIN_SUCCESS_RATE: "0.8"
          IMAGE_HEALTH_REPORT: artifacts/post-publish-catalog-image-health.json
        run: node scripts/catalog-image-health.js

      - name: Upload post-publish image health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-publish-catalog-image-health
          path: artifacts/post-publish-catalog-image-health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload catalog freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-freshness
          path: artifacts/catalog-freshness.json
          if-no-files-found: error
          retention-days: 14
