name: Visual QA screenshots

on:
  pull_request:
    paths:
      - "index.html"
      - "demo.html"
      - "src/demo.js"
      - "styles/**"
      - "src/release-ui.js"
      - "src/child-profiles.js"
      - "src/runtime-diagnostic.js"
      - "scripts/release-ui-browser-qa.cjs"
      - "assets/**"
      - "data/**"
      - ".github/workflows/visual-qa-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify bounded image-recovery interactions
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild'
        run: node scripts/release-ui-image-recovery-qa.cjs
      - name: Decode every actual original photo for manual review
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild'
        run: node scripts/catalog-image-decode-qa.cjs
      - name: Capture reference viewports
        env:
          QA_START_SERVER: "1"
          QA_REQUIRE_HEALTHY_IMAGES: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && '1' || '0' }}
          QA_REQUIRE_PLAY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && '1' || '0' }}
        run: |
          QA_OUTPUT=artifacts/visual-qa node scripts/release-ui-browser-qa.cjs
      - name: Preserve exact review QA provenance
        if: always()
        env:
          REVIEW_SHA: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts
          node -e 'const fs=require("node:fs"),catalog=require("./data/catalog.json");fs.writeFileSync("artifacts/review-qa-provenance.json",JSON.stringify({reviewSha:process.env.REVIEW_SHA,qaRunId:process.env.QA_RUN_ID,catalogSyncedAt:catalog.syncedAt,catalogExpiresAt:catalog.expiresAt},null,2)+"\n")'
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: |
            artifacts/visual-qa/
            artifacts/actual-image-decoding.json
            artifacts/review-qa-provenance.json
          if-no-files-found: warn
          retention-days: 1
