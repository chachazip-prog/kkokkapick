name: Visual QA screenshots

on:
  pull_request:
    paths:
      - "index.html"
      - "data/**"
      - ".github/workflows/visual-qa-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture reference viewports
        run: |
          python3 -m http.server 4173 >/tmp/kkokkapick-http.log 2>&1 &
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('artifacts/visual-qa',{recursive:true});
          const browser=await chromium.launch({headless:true});
          for (const width of [320,375,390,430]) {
            const page=await browser.newPage({viewport:{width,height:844},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.screenshot({path:`artifacts/visual-qa/home-${width}.png`,fullPage:true});
            await page.screenshot({path:`artifacts/visual-qa/home-viewport-${width}.png`});
            await page.locator('#searchNav').click();
            await page.screenshot({path:`artifacts/visual-qa/search-${width}.png`,fullPage:true});
            await page.screenshot({path:`artifacts/visual-qa/search-viewport-${width}.png`});
            await page.locator('#favNav').click();
            await page.screenshot({path:`artifacts/visual-qa/favorites-${width}.png`,fullPage:true});
            await page.screenshot({path:`artifacts/visual-qa/favorites-viewport-${width}.png`});
            await page.locator('#myNav').click();
            await page.screenshot({path:`artifacts/visual-qa/my-${width}.png`,fullPage:true});
            await page.screenshot({path:`artifacts/visual-qa/my-viewport-${width}.png`});
            await page.locator('#homeNav').click();
            const card=page.locator('.card').first();
            if(await card.count()){await card.click();await page.waitForTimeout(200);await page.screenshot({path:`artifacts/visual-qa/detail-${width}.png`,fullPage:true});await page.screenshot({path:`artifacts/visual-qa/detail-viewport-${width}.png`});}
            await page.close();
          }
          await browser.close();
          EOF
          node capture.mjs
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: artifacts/visual-qa/*.png
          if-no-files-found: error
          retention-days: 30
