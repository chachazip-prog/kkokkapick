name: Visual QA screenshots

on:
  pull_request:
    paths:
      - "index.html"
      - "demo.html"
      - "src/demo.js"
      - "styles/**"
      - "src/release-ui.js"
      - "src/child-profiles.js"
      - "src/runtime-diagnostic.js"
      - "scripts/release-ui-browser-qa.cjs"
      - "assets/**"
      - "data/**"
      - ".github/workflows/visual-qa-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture reference viewports
        run: |
          python3 -m http.server 4173 >/tmp/kkokkapick-http.log 2>&1 &
          QA_OUTPUT=artifacts/visual-qa node scripts/release-ui-browser-qa.cjs
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: artifacts/visual-qa/
          if-no-files-found: error
          retention-days: 30
