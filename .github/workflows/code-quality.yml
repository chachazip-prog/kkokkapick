name: Code quality

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "index.html"
      - "admin/**"
      - "supabase/**"
      - "flutter/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "index.html"
      - "admin/**"
      - "supabase/**"
      - "flutter/**"

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: |
          node test/provider-policy.test.js
          node test/product-classifier.test.js
          node test/brand-normalizer.test.js
          node test/kkokkafit-engine.test.js
          node test/price-tracker.test.js
          node test/client-product.test.js
          node test/recommendation-ranker.test.js
          node test/popup-policy.test.js
          node test/commercial-client.test.js
          node test/account-deletion-contract.test.js
          node test/commercial-event-abuse-contract.test.js
      - name: Validate web module syntax
        run: |
          node --check src/kkokkafit-engine.js
          node --check src/brand-size-charts.js
          node --check src/price-tracker.js
          node --check src/client-product.js
          node --check src/recommendation-ranker.js
          node --check src/popup-policy.js
          node --check src/commercial-client.js
          node --check src/public-commercial-client.js
          node --check admin/admin.js
          node --check scripts/build-catalog.js
      - name: Security sanity checks
        run: |
          if grep -R -n -E '(service_role|SUPABASE_SERVICE_ROLE|ADPICK_BIZ_API_KEY)[[:space:]]*[:=][[:space:]]*["'\''"][^"'\'']+' admin src flutter supabase --exclude='*.md'; then
            echo "Potential secret-like assignment found in client/repository code"
            exit 1
          fi
          test -f supabase/migrations/013_catalog_rls_hardening.sql
          test -f supabase/migrations/015_public_catalog_boundary.sql
          ! grep -q 'price_history_product_observed_idx' supabase/migrations/004_product_read_model.sql
          ! grep -q 'price_history(product_id' supabase/migrations/004_product_read_model.sql
          grep -q 'revoke all on public.published_catalog_products from anon,authenticated' supabase/migrations/015_public_catalog_boundary.sql
          grep -q 'revoke all on public.published_catalog_offers from anon,authenticated' supabase/migrations/015_public_catalog_boundary.sql
          test -f supabase/migrations/016_account_data_lifecycle.sql
          grep -q "auth.uid()" supabase/migrations/016_account_data_lifecycle.sql
          grep -q "grant execute on function public.delete_my_app_data() to authenticated" supabase/migrations/016_account_data_lifecycle.sql
          grep -Fq 'do $$ begin' supabase/migrations/016_account_data_lifecycle.sql
          grep -Fq 'end $$;' supabase/migrations/016_account_data_lifecycle.sql
