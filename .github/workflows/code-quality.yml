name: Code quality

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "index.html"
      - "admin/**"
      - "supabase/**"
      - "flutter/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "index.html"
      - "admin/**"
      - "supabase/**"
      - "flutter/**"

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: |
          node test/provider-policy.test.js
          node test/adpick-discovery-plan.test.js
          node test/catalog-quality-report.test.js
          node test/product-classifier.test.js
          node test/brand-normalizer.test.js
          node test/kkokkafit-engine.test.js
          node test/price-tracker.test.js
          node test/client-product.test.js
          node test/product-grouper-release.test.js
          node test/recommendation-ranker.test.js
          node test/popup-policy.test.js
          node test/commercial-client.test.js
          node test/account-deletion-contract.test.js
          node test/commercial-event-abuse-contract.test.js
          node test/release-artifact-contract.test.js
          node test/production-config-contract.test.js
          node test/production-verification-contract.test.js
          node test/provider-sync-workflow-contract.test.js
          node test/push-worker-contract.test.js
          node test/commercial-event-concurrency-contract.test.js
          node test/child-profile-sync-contract.test.js
          node test/preview-parity.test.js
          node test/release-hardening-contract.test.js
          node test/image-health.test.js
          node test/physical-qa-snapshot.test.js
          node test/external-beta-readiness.test.js
          node test/production-boundary-reconciliation.test.js
          node test/production-migration-manifest.test.js
          node test/production-verification-validator.test.js
          node test/production-email-auth-smoke.test.js
          node test/production-supabase-activation-workflow.test.js
          node test/social-auth-platform-contract.test.js
          node test/push-provider-result.test.js
          node test/fcm-sender.test.js
          node test/apns-sender.test.js
          node test/price-alert-push-worker.test.js
          node test/push-delivery-fanout-contract.test.js
          node test/push-worker-entrypoint.test.js
          node test/production-push-workflow.test.js
      - name: Check catalog image URL coverage
        run: node scripts/catalog-image-quality.js

      - name: Validate web module syntax
        run: |
          node --check src/adpick-discovery-plan.js
          node --check scripts/discover-adpick.js
          node --check src/kkokkafit-engine.js
          node --check src/brand-size-charts.js
          node --check src/price-tracker.js
          node --check src/client-product.js
          node --check src/product-grouper.js
          node --check src/recommendation-ranker.js
          node --check src/popup-policy.js
          node --check src/commercial-client.js
          node --check src/public-commercial-client.js
          node --check admin/admin.js
          node --check scripts/build-catalog.js
          node --check scripts/catalog-image-health.js
          node --check scripts/adpick-image-diagnostic.js
          node --check src/image-health.js
          node --check scripts/physical-qa-snapshot.js
          node --check scripts/external-beta-readiness.js
          node --check scripts/production-migration-manifest.js
          node --check scripts/validate-production-verification.js
          node --check scripts/production-email-auth-smoke.js
          node --check src/push-provider-result.js
          node --check src/fcm-sender.js
          node --check src/apns-sender.js
          node --check src/supabase-push-worker-backend.js
          node --check src/price-alert-push-worker.js
          node --check scripts/run-price-alert-push-worker.js
          node --check scripts/production-push-smoke.js
      - name: Security sanity checks
        run: |
          if grep -R -n -E '(service_role|SUPABASE_SERVICE_ROLE|ADPICK_BIZ_API_KEY)[[:space:]]*[:=][[:space:]]*["'\''"][^"'\'']+' admin src flutter supabase --exclude='*.md'; then
            echo "Potential secret-like assignment found in client/repository code"
            exit 1
          fi
          test -f supabase/migrations/013_catalog_rls_hardening.sql
          test -f supabase/migrations/015_public_catalog_boundary.sql
          ! grep -q 'price_history_product_observed_idx' supabase/migrations/004_product_read_model.sql
          ! grep -q 'price_history(product_id' supabase/migrations/004_product_read_model.sql
          grep -q 'revoke all on public.published_catalog_products from anon,authenticated' supabase/migrations/015_public_catalog_boundary.sql
          grep -q 'revoke all on public.published_catalog_offers from anon,authenticated' supabase/migrations/015_public_catalog_boundary.sql
          test -f supabase/migrations/016_account_data_lifecycle.sql
          grep -q "auth.uid()" supabase/migrations/016_account_data_lifecycle.sql
          grep -q "grant execute on function public.delete_my_app_data() to authenticated" supabase/migrations/016_account_data_lifecycle.sql
          grep -Fq 'do $$ begin' supabase/migrations/016_account_data_lifecycle.sql
          grep -Fq 'end $$;' supabase/migrations/016_account_data_lifecycle.sql
          test -f supabase/migrations/029_child_profile_age_months_sync.sql
          grep -q 'age_months integer' supabase/migrations/029_child_profile_age_months_sync.sql
          test -f supabase/migrations/030_production_boundary_reconciliation.sql
          grep -q 'alter table public.profiles enable row level security' supabase/migrations/030_production_boundary_reconciliation.sql
          grep -q 'alter table public.provider_themes enable row level security' supabase/migrations/030_production_boundary_reconciliation.sql
          grep -q 'revoke all on public.product_price_summary from public,anon,authenticated' supabase/migrations/030_production_boundary_reconciliation.sql
          test -f supabase/migrations/031_push_delivery_target_fanout.sql
          grep -q 'create table if not exists public.price_alert_delivery_targets' supabase/migrations/031_push_delivery_target_fanout.sql
          grep -q 'to service_role' supabase/migrations/031_push_delivery_target_fanout.sql
