name: Flutter quality

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-quality.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-quality.yml"

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: flutter
        run: flutter pub get
      - working-directory: flutter
        run: flutter analyze
      - working-directory: flutter
        run: flutter test
      - name: Reject debug signing in release config
        working-directory: flutter
        run: |
          if grep -q 'release.*signingConfig.*debug' android/app/build.gradle.kts; then
            echo "Release build must not use debug signing"
            exit 1
          fi
      - name: Build Android debug artifact
        working-directory: flutter
        run: flutter build apk --debug
