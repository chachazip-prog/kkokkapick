name: ADPICK image source diagnostic

on:
  pull_request:
    paths:
      - "scripts/adpick-image-diagnostic.js"
      - ".github/workflows/adpick-image-diagnostic.yml"
      - "src/adpick-biz-provider.js"
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Compare fresh and existing image URLs without full discovery or catalog publication
        type: boolean
        required: false
        default: false
      review_artifact_run_id:
        description: Existing successful review-catalog artifact run to copy to the review branch (no API refresh)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: adpick-source-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'chachazip-prog/kkokkapick' && !inputs.review_artifact_run_id
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      review_artifact_id: ${{ steps.review_catalog.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe fresh ADPICK search image URLs
        if: inputs.diagnostic_only || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/codex/release-ui-rebuild'
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_BIZ_API_KEY }}
        run: node scripts/adpick-image-diagnostic.js
      - name: Generate fresh review catalog without publishing main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && !inputs.diagnostic_only
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_BIZ_API_KEY }}
        run: |
          node scripts/discover-adpick.js
          node scripts/build-catalog.js
      - name: Upload temporary review catalog
        id: review_catalog
        if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && !inputs.diagnostic_only
        uses: actions/upload-artifact@v4
        with:
          name: adpick-review-catalog
          path: |
            data/adpick-biz-products.json
            data/catalog.json
            data/price-history.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adpick-image-diagnostic
          path: artifacts/adpick-image-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

  handoff-review-catalog:
    if: github.repository == 'chachazip-prog/kkokkapick' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && inputs.review_artifact_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate artifact run provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.review_artifact_run_id }}
        run: node scripts/validate-review-artifact-run.cjs
      - name: Download existing temporary review catalog
        uses: actions/download-artifact@v4
        with:
          name: adpick-review-catalog
          run-id: ${{ inputs.review_artifact_run_id }}
          github-token: ${{ github.token }}
          path: .review-catalog
      - name: Build photo-ready catalog with current relevance rules
        run: CATALOG_DATA_DIR=.review-catalog node scripts/build-catalog.js
      - name: Exclude unavailable photos without losing seller facts
        run: CATALOG_DATA_DIR=.review-catalog node scripts/prepare-photo-catalog.js
      - name: Recheck original images immediately before review publication
        env:
          CATALOG_IMAGE_HEALTH_INPUT: .review-catalog/catalog.json
          IMAGE_HEALTH_ALL: "1"
          IMAGE_HEALTH_MIN_SUCCESS_RATE: "1"
        run: node scripts/catalog-image-health.js
      - name: Validate and commit review data only
        run: |
          node scripts/handoff-review-catalog.cjs
          node scripts/catalog-quality-report.js > catalog-quality-report.json
          git config user.name "kkokkapick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adpick-biz-products.json data/catalog.json data/price-history.json catalog-quality-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh temporary review catalog with verified ADPICK images"
          git push origin HEAD:codex/release-ui-rebuild

  publish-fresh-review-catalog:
    needs: diagnostic
    if: github.repository == 'chachazip-prog/kkokkapick' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && !inputs.diagnostic_only && inputs.review_artifact_run_id == '' && needs.diagnostic.outputs.review_artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download only the freshly generated artifact from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.diagnostic.outputs.review_artifact_id }}
          merge-multiple: true
          path: .review-catalog
      - name: Exclude unavailable photos without losing seller facts
        run: CATALOG_DATA_DIR=.review-catalog node scripts/prepare-photo-catalog.js
      - name: Independently recheck all original images immediately before publication
        env:
          CATALOG_IMAGE_HEALTH_INPUT: .review-catalog/catalog.json
          IMAGE_HEALTH_ALL: "1"
          IMAGE_HEALTH_MIN_SUCCESS_RATE: "1"
        run: node scripts/catalog-image-health.js
      - name: Validate and commit review data only
        run: |
          node scripts/handoff-review-catalog.cjs
          node scripts/catalog-quality-report.js > catalog-quality-report.json
          git config user.name "kkokkapick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adpick-biz-products.json data/catalog.json data/price-history.json catalog-quality-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish immediately verified temporary review catalog"
          git push origin HEAD:codex/release-ui-rebuild
