name: ADPICK image source diagnostic

on:
  pull_request:
    paths:
      - "scripts/adpick-image-diagnostic.js"
      - ".github/workflows/adpick-image-diagnostic.yml"
      - "src/adpick-biz-provider.js"
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Compare fresh and existing image URLs without full discovery or catalog publication
        type: boolean
        required: false
        default: false
      review_artifact_run_id:
        description: Existing successful review-catalog artifact run to copy to the review branch (no API refresh)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: adpick-source-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'chachazip-prog/kkokkapick' && !inputs.review_artifact_run_id
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic_only }}
    outputs:
      review_artifact_id: ${{ steps.review_catalog.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe fresh ADPICK search image URLs
        if: inputs.diagnostic_only || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/codex/release-ui-rebuild'
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_BIZ_API_KEY }}
        run: node scripts/adpick-image-diagnostic.js
      - name: Generate fresh review catalog without publishing main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && !inputs.diagnostic_only
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_BIZ_API_KEY }}
          ADPICK_COLLECTION_MODE: review-quarantine
        run: |
          node scripts/discover-adpick.js
          node scripts/build-catalog.js
      - name: Upload temporary review catalog
        id: review_catalog
        if: success() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && !inputs.diagnostic_only
        uses: actions/upload-artifact@v4
        with:
          name: adpick-review-catalog
          path: |
            data/adpick-biz-products.json
            data/catalog.json
            data/price-history.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adpick-image-diagnostic
          path: artifacts/adpick-image-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

  handoff-review-catalog:
    if: github.repository == 'chachazip-prog/kkokkapick' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && inputs.review_artifact_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate artifact run provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.review_artifact_run_id }}
        run: node scripts/validate-review-artifact-run.cjs
      - name: Download existing temporary review catalog
        uses: actions/download-artifact@v4
        with:
          name: adpick-review-catalog
          run-id: ${{ inputs.review_artifact_run_id }}
          github-token: ${{ github.token }}
          path: .review-catalog
      - name: Build photo-ready catalog with current relevance rules
        run: CATALOG_DATA_DIR=.review-catalog node scripts/build-catalog.js
      - name: Exclude unavailable photos without losing seller facts
        env:
          ADPICK_COLLECTION_MODE: review-quarantine
        run: CATALOG_DATA_DIR=.review-catalog node scripts/prepare-photo-catalog.js
      - name: Recheck original images immediately before review publication
        env:
          CATALOG_IMAGE_HEALTH_INPUT: .review-catalog/catalog.json
          IMAGE_HEALTH_ALL: "1"
          IMAGE_HEALTH_MIN_SUCCESS_RATE: "1"
          IMAGE_HEALTH_FULL_RECHECK_ON_TRANSIENT: "1"
          IMAGE_HEALTH_REPORT: artifacts/review-image-health.json
        run: node scripts/catalog-image-health.js
      - name: Preserve final image audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-final-image-health
          path: artifacts/review-image-health.json
          if-no-files-found: warn
          retention-days: 1
      - name: Validate and commit review data only
        run: |
          node scripts/handoff-review-catalog.cjs
          node scripts/catalog-quality-report.js > catalog-quality-report.json
          git config user.name "kkokkapick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adpick-biz-products.json data/catalog.json data/price-history.json catalog-quality-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh temporary review catalog with verified ADPICK images"
          git push origin HEAD:codex/release-ui-rebuild

  publish-fresh-review-catalog:
    needs: diagnostic
    if: github.repository == 'chachazip-prog/kkokkapick' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && !inputs.diagnostic_only && inputs.review_artifact_run_id == '' && needs.diagnostic.outputs.review_artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      published_sha: ${{ steps.publish_review.outputs.sha }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download only the freshly generated artifact from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.diagnostic.outputs.review_artifact_id }}
          merge-multiple: true
          path: .review-catalog
      - name: Exclude unavailable photos without losing seller facts
        env:
          ADPICK_COLLECTION_MODE: review-quarantine
        run: CATALOG_DATA_DIR=.review-catalog node scripts/prepare-photo-catalog.js
      - name: Independently recheck all original images immediately before publication
        env:
          CATALOG_IMAGE_HEALTH_INPUT: .review-catalog/catalog.json
          IMAGE_HEALTH_ALL: "1"
          IMAGE_HEALTH_MIN_SUCCESS_RATE: "1"
          IMAGE_HEALTH_FULL_RECHECK_ON_TRANSIENT: "1"
          IMAGE_HEALTH_REPORT: artifacts/review-image-health.json
        run: node scripts/catalog-image-health.js
      - name: Preserve final image audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-final-image-health
          path: artifacts/review-image-health.json
          if-no-files-found: warn
          retention-days: 1
      - name: Validate and commit review data only
        id: publish_review
        run: |
          node scripts/handoff-review-catalog.cjs
          node scripts/catalog-quality-report.js > catalog-quality-report.json
          git config user.name "kkokkapick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adpick-biz-products.json data/catalog.json data/price-history.json catalog-quality-report.json
          if git diff --cached --quiet; then
            printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish immediately verified temporary review catalog"
          git push origin HEAD:codex/release-ui-rebuild
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-fresh-review:
    needs: publish-fresh-review-catalog
    if: github.repository == 'chachazip-prog/kkokkapick' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/release-ui-rebuild' && needs.publish-fresh-review-catalog.outputs.published_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-fresh-review-catalog.outputs.published_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify failure recovery separately from real-photo QA
        run: node scripts/release-ui-image-recovery-qa.cjs
      - name: Decode every original catalog photo without changing source evidence
        run: node scripts/catalog-image-decode-qa.cjs
      - name: Capture real products and verify interactions at four mobile widths
        env:
          QA_START_SERVER: "1"
          QA_REQUIRE_HEALTHY_IMAGES: "1"
          QA_REQUIRE_PLAY: "1"
          QA_OUTPUT: artifacts/actual-visual-qa
        run: node scripts/release-ui-browser-qa.cjs
      - name: Preserve exact publication identity
        if: always()
        env:
          REVIEW_SHA: ${{ needs.publish-fresh-review-catalog.outputs.published_sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts
          node -e 'const fs=require("node:fs"),catalog=require("./data/catalog.json");fs.writeFileSync("artifacts/review-qa-provenance.json",JSON.stringify({reviewSha:process.env.REVIEW_SHA,sourceRunId:process.env.SOURCE_RUN_ID,catalogSyncedAt:catalog.syncedAt,catalogExpiresAt:catalog.expiresAt},null,2)+"\n")'
      - name: Preserve actual-photo QA evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-review-actual-photo-qa
          path: |
            artifacts/actual-image-decoding.json
            artifacts/actual-visual-qa
            artifacts/review-qa-provenance.json
          if-no-files-found: warn
          retention-days: 1
