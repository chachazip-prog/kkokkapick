name: Prepare physical QA snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate physical QA evidence snapshot
        run: node scripts/physical-qa-snapshot.js
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: physical-qa-snapshot
          path: artifacts/physical-qa-snapshot.json
          if-no-files-found: error
          retention-days: 30
