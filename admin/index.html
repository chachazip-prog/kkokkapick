<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꼬까픽 Admin Prototype</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f5f6f8;color:#202124}.wrap{max-width:1180px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.brand b{color:#ff7043}.notice{background:#fff3ed;color:#a84b2d;padding:10px 14px;border-radius:10px;font-size:12px}.tabs{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.tab{border:1px solid #ddd;background:#fff;padding:10px 14px;border-radius:10px}.tab.on{background:#222;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:18px}.stat b{font-size:25px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}h2{font-size:18px}.row{display:grid;grid-template-columns:1fr 120px 110px 120px;gap:8px;padding:12px 0;border-top:1px solid #eee;align-items:center}.badge{font-size:11px;background:#eef5ff;padding:5px 8px;border-radius:8px;width:max-content}.sponsor{background:#fff1eb;color:#c64e27}.btn{border:0;background:#222;color:#fff;padding:10px 13px;border-radius:9px}.secondary{background:#eee;color:#222}.form label{font-size:12px;color:#666;display:block;margin-top:12px}.form input,.form select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:4px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 90px}.row>*:nth-child(n+3){display:none}}</style></head><body><main class="wrap"><div class="head"><div><div class="brand">꼬까<b>픽</b> Admin</div><small>운영자용 수익화 관리 프로토타입</small></div><div class="notice" id="connectionStatus">연결 상태 확인 중</div></div>
<section class="card form" id="loginPanel" style="margin-top:18px"><h2>관리자 로그인</h2><form id="loginForm"><label>이메일<input id="adminEmail" type="email" autocomplete="username" required></label><label>비밀번호<input id="adminPassword" type="password" autocomplete="current-password" required></label><br><button class="btn" type="submit">로그인</button></form><p style="font-size:11px;color:#777">Supabase 관리자 인증 연결 전에는 안전 모드로 유지됩니다.</p></section><nav class="tabs"><button class="tab on">대시보드</button><button class="tab">스폰서·기획전</button><button class="tab">프리미엄 입점</button><button class="tab">육아 커머스 제휴</button><button class="tab">카탈로그 보정</button></nav>
<section class="stats"><div class="card stat"><small>게시 중</small><br><b>0</b></div><div class="card stat"><small>예약</small><br><b>0</b></div><div class="card stat"><small>이번 달 제휴 클릭</small><br><b>—</b></div><div class="card stat"><small>확정 수익</small><br><b>—</b></div></section>
<section class="grid"><div class="card"><div class="head"><h2>캠페인</h2><button class="btn" onclick="document.getElementById('editor').scrollIntoView()">+ 새 캠페인</button></div><div id="campaignRows"><div class="row"><b>아직 등록된 캠페인이 없습니다.</b><span class="badge">초안</span><span>—</span><span>—</span></div></div><p style="font-size:12px;color:#777">실제 데이터 연결 후 예약 시작·종료, 노출 위치, 상품 순서와 성과를 여기에서 관리합니다.</p></div>
<div class="card form" id="editor"><h2>캠페인 초안</h2><label>유형<select id="campaignType"><option>스폰서 상품</option><option>시즌/월령 기획전</option><option>프리미엄 브랜드</option><option>육아 커머스 제휴</option></select></label><label>파트너/브랜드<input placeholder="예: 브랜드명"></label><label>캠페인명<input id="campaignTitle" placeholder="예: 12~24개월 봄 아우터"></label><label>노출 위치<select id="placement"><option>홈 추천 영역</option><option>검색 결과</option><option>카테고리 기획전</option></select></label><label>광고 표시<input value="Sponsored" readonly></label><label>게시 기간<input placeholder="시작일시 → 종료일시"></label><p style="font-size:11px;color:#777">유료 입점 여부와 꼬까핏 검증은 분리됩니다. 공식 근거가 없는 브랜드는 비용을 지불해도 verified가 되지 않습니다.</p><button class="btn secondary" id="saveCampaign" type="button" disabled>초안 저장</button></div></section>
</main><script src="./config.js"></script><script type="module" src="./admin.js"></script></body></html>
